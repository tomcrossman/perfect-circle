<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Perfect Circle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perfect Circle">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Perfect Circle - draw a circle around the dot in one stroke, and find out how round you really are.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS - the same house style as Run Boys, Run
   ============================================================ */
:root {
    --ink:    #241F2E;
    --paper:  #FBF7EC;
    --rule:   rgba(64, 92, 122, .085);
    --rule2:  rgba(64, 92, 122, .15);
    --panel:  #fffdf8;
    --gold:   #f4b32c;
    --blue:   #2fa8e0;
    --good:   #3fa45b;
    --danger: #e8524f;
    --pop:    4px 4px 0 var(--ink);
    --pop-s:  2px 2px 0 var(--ink);   /* the HUD, which is not the main event */
    --font:         "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
    --font-display: "Bangers", "Comic Sans MS", Impact, system-ui, sans-serif;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0; overflow: hidden;
    font-family: var(--font); color: var(--ink);
    background: var(--paper);
}
/* squared paper: a fine grid with a heavier one every fifth line, and a little
   warmth in the corners so it reads as a sheet rather than a spreadsheet */
#app {
    position: fixed; inset: 0; overflow: hidden; touch-action: none;
    background:
        radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(120, 96, 52, .09) 100%),
        repeating-linear-gradient(0deg, var(--rule2) 0 1.3px, transparent 1.3px 85px),
        repeating-linear-gradient(90deg, var(--rule2) 0 1.3px, transparent 1.3px 85px),
        repeating-linear-gradient(0deg, var(--rule) 0 1px, transparent 1px 17px),
        repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 17px),
        var(--paper);
}

/* the paper you draw on */
#pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ============================================================
   HUD
   ============================================================ */
#hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 7px;
    padding: 12px 10px; pointer-events: none;
}
.plate {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-display); font-size: 23px; letter-spacing: .02em;
    padding: 4px 10px 2px;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop-s);
}
.plate .ico { width: 17px; height: 17px; fill: var(--gold); flex: none; }
#mute {
    pointer-events: auto; cursor: pointer; align-self: center;
    padding: 6px 7px 3px; line-height: 0;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop-s);
}
#mute:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: inline; }

/* what to do, until you have done it once */
#prompt {
    position: absolute; left: 0; right: 0; bottom: 10%; z-index: 2;
    text-align: center; pointer-events: none; padding: 0 22px;
    font-family: var(--font-display); font-size: clamp(19px, 5.4vw, 26px); letter-spacing: .03em;
    color: var(--ink); opacity: .62;
    transition: opacity .2s;
}
#prompt.gone { opacity: 0; }

/* got through: the score, a beat to read it, and straight on. A card and a
   button between every round is a tap you never wanted to make */
#tally {
    position: absolute; left: 0; right: 0; bottom: 11%; z-index: 9;
    text-align: center; pointer-events: none; display: none; padding: 0 18px;
}
#tally.on { display: block; animation: tallyIn .3s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes tallyIn { from { transform: translateY(14px) scale(.9); opacity: 0; }
                     to   { transform: none; opacity: 1; } }
#tally .n {
    display: block; font-family: var(--font-display); font-size: clamp(46px, 15vw, 64px);
    line-height: 1; letter-spacing: .02em; color: var(--good);
}
#tally .n i { font-style: normal; font-size: .4em; opacity: .7; }
#tally .l { display: block; font-family: var(--font-display); font-size: 24px; letter-spacing: .03em; }
#tally .b {
    display: block; font-family: var(--font); font-size: 11px; font-weight: 900;
    letter-spacing: .05em; opacity: .45; margin-top: 4px;
}

/* ============================================================
   THE VERDICT
   ============================================================ */
#card {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 14px 18px 16px; pointer-events: none;
    /* no scrim over the drawing: the circle you just made is the point */
    background: linear-gradient(transparent 46%, rgba(24,20,32,.16) 78%, rgba(24,20,32,.34) 100%);
}
#card[hidden] { display: none; }
#card .inner {
    position: relative; flex: none; pointer-events: auto;
    animation: sheetIn .34s cubic-bezier(.2, 1.3, .4, 1) both;
    width: 100%; max-width: 320px; padding: 20px;
    background: var(--panel); border: 3.5px solid var(--ink); border-radius: 22px;
    box-shadow: 4px 4px 0 var(--ink); text-align: center;
}
@keyframes sheetIn { from { transform: translateY(26px); opacity: 0; }
                     to   { transform: translateY(0); opacity: 1; } }
#ribbon {
    display: none; position: absolute; top: -21px; left: 50%;
    font-family: var(--font-display); font-size: 17px; letter-spacing: .08em; white-space: nowrap;
    padding: 3px 16px 1px; transform: translateX(-50%) rotate(-3deg);
    background: var(--danger); color: var(--panel);
    border: 3px solid var(--ink); border-radius: 9px; box-shadow: var(--pop-s);
    animation: ribbonIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes ribbonIn { from { transform: translateX(-50%) rotate(-3deg) scale(0); }
                      to   { transform: translateX(-50%) rotate(-3deg) scale(1); } }
#card.failed #ribbon { display: block; }
#card.record .inner { border-color: var(--gold); }
#card.record #score { animation: scorePop .7s cubic-bezier(.2, 1.7, .4, 1) both; }
@keyframes scorePop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* George, taking a view on your circle */
.cheer {
    position: absolute; left: -22px; top: -16px;
    width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(#cfe4f7, #eaf3fb);
    border: 3.5px solid var(--ink); box-shadow: var(--pop-s);
    animation: cheerIn .6s cubic-bezier(.2, 1.7, .4, 1) both;
}
.cheer svg { width: 100%; height: 100%; display: block; }
@keyframes cheerIn { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(-6deg); } }
/* the shape is what you drew; the face is whether it got you through, and
   those are not the same question - an egg over a low bar is a happy egg */
.cheer .fx { display: none; }
#card.failed .fh { display: none; }
#card.failed .fx { display: block; }

#score {
    display: block; font-family: var(--font-display); font-size: 66px; line-height: .95;
    letter-spacing: .02em; color: var(--gold); margin: 6px 0 0;
}
#score .pc { font-size: .34em; opacity: .65; margin-left: 5px; }
#rating {
    margin: 2px 0 0; font-family: var(--font-display); font-size: 26px; letter-spacing: .03em;
}
#note { margin: 6px 0 0; font-size: 12px; font-weight: 700; line-height: 1.45; opacity: .7; }
.btn {
    margin-top: 12px; width: 100%;
    font-family: var(--font-display); font-size: 24px; font-weight: 400; letter-spacing: .03em;
    padding: 12px; color: var(--ink);
    background: var(--gold); border: 3px solid var(--ink); border-radius: 15px;
    box-shadow: var(--pop-s); cursor: pointer;
}
.btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }

.confetti {
    position: absolute; z-index: 9; pointer-events: none; top: -30px;
    width: 12px; height: 16px; border: 2.5px solid var(--ink); border-radius: 3px;
}
/* the moment the lap closes */
#flash {
    position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
}
#app.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
    10%, 90% { transform: translate3d(-3px, 1px, 0); }
    20%, 80% { transform: translate3d(7px, -2px, 0); }
    30%, 50%, 70% { transform: translate3d(-11px, 2px, 0); }
    40%, 60% { transform: translate3d(11px, -1px, 0); }
}
#app.lift { animation: lift .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes lift {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.022); }
    100% { transform: scale(1); }
}
#version { position: absolute; bottom: 8px; right: 10px; z-index: 3;
           font-size: 9px; font-weight: 800; letter-spacing: .1em; opacity: .3; }

/* ============================================================
   THE RUN
   ============================================================ */
#hud { gap: 6px; }
.plate .of {
    display: inline-flex; align-items: center; gap: 3px;
    margin-left: 7px; padding-left: 8px; border-left: 2.5px solid rgba(36,31,46,.18);
    font-size: .74em; opacity: .62;
}
/* once you are past your best, the plate is your own run saying so */
#bestplate.beating { background: var(--gold); animation: beat .5s ease-in-out infinite alternate; }
#bestplate.beating .of { display: none; }
@keyframes beat { from { transform: scale(1); } to { transform: scale(1.06); } }
/* the clock, when the round has one */
/* In the top row with everything else, taking whatever width is left. It is
   hidden rather than removed between rounds, so the row never jumps. */
#clock {
    flex: 1; min-width: 64px; visibility: hidden;
    display: flex; align-items: center; gap: 7px; padding: 4px 7px;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop-s);
}
#clock.on { visibility: visible; }
#clock .ico { width: 17px; height: 17px; flex: none; fill: var(--ink); }
#clock .track {
    flex: 1; height: 13px; border-radius: 7px; overflow: hidden;
    background: rgba(36,31,46,.12); border: 2px solid var(--ink);
}
#clock i { display: block; height: 100%; width: 100%; background: var(--gold); }
#clock.low i { background: var(--danger); }
#clock.low { animation: lowPulse .3s ease-in-out infinite alternate; }
@keyframes lowPulse { from { transform: scale(1); } to { transform: scale(1.04); } }

/* the round you are on, announced then faded */
#banner {
    position: absolute; left: 0; right: 0; top: 34%; z-index: 4;
    text-align: center; pointer-events: none; opacity: 0;
    font-family: var(--font-display); letter-spacing: .03em; color: var(--ink);
}
#banner .r { display: block; font-size: clamp(38px, 12vw, 60px); line-height: 1; }
#banner.go { animation: bannerGo 1.25s ease-out both; }
@keyframes bannerGo {
    0%   { transform: scale(.7); opacity: 0; }
    18%  { transform: scale(1); opacity: 1; }
    72%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.08); opacity: 0; }
}

/* the verdict, round by round */
#pass { margin: 5px 0 0; font-size: 12px; font-weight: 900; letter-spacing: .04em; opacity: .8; }
#pass .ok { color: var(--good); }
#pass .no { color: var(--danger); }
#card.failed #score { color: var(--danger); }
#card.failed .inner { border-color: var(--danger); }
/* a best outranks the miss it arrived on: gold, not red, and pleased about it */
#card.record.failed .inner { border-color: var(--gold); }
#card.record.failed #score { color: var(--gold); }
#card.record #ribbon { background: var(--gold); color: var(--ink); }
#card.record .fh { display: block; }
#card.record .fx { display: none; }

#summary {
    display: none; margin: 11px 0 0; color: var(--gold);
    font-family: var(--font-display); font-size: 19px; letter-spacing: .03em;
}
#card.failed #summary { display: block; }
#summary .ico { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; fill: var(--gold); }
#card.failed #note { display: none; }

/* ============================================================
   DRAWN, NOT PRINTED
   Nothing on a sheet of paper has four matching corners, and no pen lands
   twice in the same place. So every panel gets a radius where no two corners
   agree, two further passes of the outline that agree neither with the border
   nor with each other, and a degree or two of tilt - which is the whole
   difference between a dialog and a doodle.
   ============================================================ */
.plate, #mute, #clock, #card .inner, .btn, #ribbon {
    border-radius: 22px 9px 19px 12px / 11px 20px 10px 23px;
}
.plate, #mute, #clock, #card .inner, .btn { position: relative; }
.plate::before, #mute::before, #clock::before, #card .inner::before, .btn::before,
.plate::after,  #mute::after,   #clock::after,  #card .inner::after,  .btn::after {
    content: ''; position: absolute; pointer-events: none;
    border: 2.4px solid var(--ink);
}
/* the inset drifts round rather than sitting evenly, so the second line runs
   wide on one side and tight on the other, the way an overdrawn box does */
.plate::after, #mute::after, #clock::after, #card .inner::after, .btn::after {
    inset: -4px -1px -2px -3px; opacity: .34;
    border-radius: 10px 21px 11px 20px / 20px 11px 22px 10px;
    transform: rotate(1.15deg);
}
.plate::before, #mute::before, #clock::before, #card .inner::before, .btn::before {
    inset: -1px -3px -4px -1px; opacity: .17;
    border-radius: 19px 13px 23px 9px / 13px 22px 9px 19px;
    transform: rotate(-.95deg);
}
#card .inner::after  { inset: -6px -2px -3px -5px; border-width: 3px; transform: rotate(-.7deg); }
#card .inner::before { inset: -2px -5px -6px -2px; border-width: 2.6px; transform: rotate(1deg); }
#ribbon { z-index: 3; }           /* not underneath the card's extra passes */
/* a tilt each, so the row never lines up like a toolbar. These are the
   independent rotate property on purpose: transform is spoken for by the
   press, the beat and the entrances, and they all have to keep working */
.plate { rotate: -1.3deg; }
#mute  { rotate: 1.9deg; }
#clock { rotate: .9deg; }
.btn   { rotate: -1.1deg; }
#card .inner { rotate: .6deg; }
/* the faintest pencil tooth inside the panels */
#card .inner, .plate, #clock {
    background-image: repeating-linear-gradient(48deg,
        rgba(64, 92, 122, .05) 0 1.5px, transparent 1.5px 7px);
}
.cheer { z-index: 2; }            /* over the card, not under its second outline */
/* and the badge is a circle drawn by the same hand, so it is not a circle:
   an uneven one, with the further passes just inside the rim - the badge clips
   its own overflow, so an outline hung outside it would be cut off */
.cheer { border-radius: 58% 42% 54% 46% / 45% 57% 43% 55%; }
.cheer::before, .cheer::after {
    content: ''; position: absolute; pointer-events: none;
    border: 2.2px solid var(--ink);
}
.cheer::after  { inset: 2px; opacity: .3;
    border-radius: 44% 56% 46% 54% / 56% 44% 55% 45%; transform: rotate(3.2deg); }
.cheer::before { inset: 5px; opacity: .14;
    border-radius: 55% 45% 57% 43% / 43% 56% 44% 57%; transform: rotate(-4deg); }
#clock .track { border-radius: 11px 5px 12px 6px / 6px 12px 5px 11px; }
#clock i { border-radius: inherit; }

/* A third thing in the HUD row is one more than a narrow phone has room for,
   so below 400px everything in it comes in a size. */
@media (max-width: 400px) {
    #hud { padding: 10px 8px; gap: 4px; }
    .plate { font-size: 18px; padding: 3px 7px 1px; }
    .plate .ico { width: 14px; height: 14px; }
    .plate .of { margin-left: 5px; padding-left: 6px; }
    #mute { padding: 5px 6px 2px; }
    #mute svg { width: 19px; height: 19px; }
}
</style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cup" viewBox="0 0 14 14">
        <path d="M 4 1.4 H 10 V 5.2 C 10 7.3, 8.7 8.6, 7 8.6 C 5.3 8.6, 4 7.3, 4 5.2 Z"/>
        <path d="M 6 8.4 H 8 V 10.4 H 6 Z"/><path d="M 3.4 10.4 H 10.6 V 12.6 H 3.4 Z"/>
        <path d="M 10.2 2.6 H 12.2 V 4.2 C 12.2 5.5, 11.2 6.2, 10.2 6.2" fill="none"
              stroke="currentColor" stroke-width="1.3"/>
        <path d="M 3.8 2.6 H 1.8 V 4.2 C 1.8 5.5, 2.8 6.2, 3.8 6.2" fill="none"
              stroke="currentColor" stroke-width="1.3"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 14 14">
        <path d="M 5.3 .5 H 8.7 V 2.2 H 5.3 Z"/>
        <path fill-rule="evenodd" d="M 7 2.1 C 10.2 2.1 12.7 4.6 12.7 7.8 C 12.7 10.9 10.2 13.5 7 13.5
                 C 3.8 13.5 1.3 10.9 1.3 7.8 C 1.3 4.6 3.8 2.1 7 2.1 Z
                 M 7 3.9 C 4.8 3.9 3.1 5.6 3.1 7.8 C 3.1 9.9 4.8 11.7 7 11.7
                 C 9.2 11.7 10.9 9.9 10.9 7.8 C 10.9 5.6 9.2 3.9 7 3.9 Z"/>
        <path d="M 6.4 5.1 H 7.6 V 8.3 H 6.4 Z"/>
        <path d="M 11 2 L 12.6 3.6 L 11.5 4.7 L 9.9 3.1 Z"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 14 14">
        <path d="M 7 1.2 L 8.8 5.2 L 13 5.7 L 9.8 8.6 L 10.7 12.8 L 7 10.6 L 3.3 12.8
                 L 4.2 8.6 L 1 5.7 L 5.2 5.2 Z"/>
    </symbol>
</svg>

<div id="app">
    <canvas id="pad"></canvas>
    <div id="flash"></div>

    <div id="hud">
        <div class="plate" id="bestplate">Round&nbsp;<span id="round-val">1</span><span
            class="of"><svg class="ico"><use href="#i-cup"/></svg><span id="best-val">0</span></span></div>
        <div id="clock"><svg class="ico"><use href="#i-clock"/></svg><span
            class="track"><i></i></span></div>
        <button id="mute" aria-label="Sound on or off">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241F2E"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 4 9 H 8 L 13 5 V 19 L 8 15 H 4 Z" fill="#241F2E"/>
                <g class="on"><path d="M 16.5 9.5 q 2 2.5 0 5"/><path d="M 19.5 7 q 3.6 5 0 10"/></g>
                <g class="off"><path d="M 17 9.5 L 22 14.5 M 22 9.5 L 17 14.5"/></g>
            </svg>
        </button>
    </div>

    <div id="banner"></div>

    <div id="tally"></div>
    <div id="prompt">Draw a circle around the dot</div>

    <div id="card" hidden>
        <div class="inner">
            <div id="ribbon"></div>
            <div class="cheer"></div>
            <span id="score">0.0<span class="pc">%</span></span>
            <p id="rating">Wonky</p>
            <p id="pass"></p>
            <p id="note"></p>
            <div id="summary"><svg class="ico"><use href="#i-cup"/></svg>Best: Round <span
                id="card-best">0</span></div>
            <button class="btn" id="again">Round 2</button>
        </div>
    </div>

    <div id="version">v1</div>
</div>

<script>
const APP_VERSION = 'v66';
document.getElementById('version').textContent = `Perfect Circle ${APP_VERSION}`;

/* ============================================================
   SOUND
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, soundOn = true;
const soundKey = 'pc-sound';
try { soundOn = localStorage.getItem(soundKey) !== 'off'; } catch (e) { /* private mode */ }

/* Five goes at the silent first stroke and I have been wrong three times, so
   rather than guess a fourth: load the page with #audio on the end and this
   prints what the audio is actually doing, on the device it is doing it on. */
const DIAG = location.hash === '#audio';
let diagEl = null;
function diag(line) {
    if (!DIAG) return;
    if (!diagEl) {
        diagEl = document.createElement('div');
        diagEl.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;max-height:45%;' +
            'overflow:auto;background:rgba(36,31,46,.92);color:#9f9;font:11px/1.45 monospace;' +
            'padding:6px 8px;white-space:pre-wrap;pointer-events:none';
        document.body.appendChild(diagEl);
    }
    const t = audioCtx ? audioCtx.currentTime.toFixed(3) : '-.---';
    diagEl.textContent += `[${t}] ${line}\n`;
    diagEl.scrollTop = diagEl.scrollHeight;
}

function audioNow() {
    if (!audioCtx) {
        if (!AC) { diag('NO AudioContext on this browser at all'); throw new Error('no audio'); }
        audioCtx = new AC();
        diag('context built, state=' + audioCtx.state + ' rate=' + audioCtx.sampleRate);
        master = audioCtx.createGain();
        master.gain.value = .7;
        master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
        diag('suspended, asking it to resume');
        audioCtx.resume().then(() => diag('resume granted, state=' + audioCtx.state))
                         .catch(e => diag('resume REFUSED: ' + e.message));
    }
    return audioCtx.currentTime;
}
function tone(t0, { freq, to, dur = .18, type = 'triangle', vol = .2, at = 0 }) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .012);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(master);
    o.start(s); o.stop(s + dur + .02);
}
/* Why the first stroke was silent, third time lucky.

   A note is scheduled from a moment in time and stopped a moment later, so if
   the moment it was given has already gone by, its stop time has gone too and
   it never sounds at all - it is not quiet, it is skipped.

   And that is exactly what the clock hands you. A context built inside a

function profile(a, key, phi) {
    const f = SHAPES[key];
    if (!f) return 1;
    if (f.table) {
        let d = (a - phi) % (Math.PI * 2);
        if (d < 0) d += Math.PI * 2;
        const x = d / (Math.PI * 2) * TABLE_N, i = Math.floor(x), fr = x - i;
        return f.table[i % TABLE_N] * (1 - fr) + f.table[(i + 1) % TABLE_N] * fr;

    if (!f.n) return 1;
    const n = f.n, sec = 2 * Math.PI / n, half = Math.PI / n;
    if (!f.inner) {                       // a regular polygon, measured from an edge
        let d = (a - phi + half) % sec;

        return Math.cos(half) / Math.cos(d - half);
    }
    // A star: every sector is one straight run out to a point and back to a
    // notch, so the radius is wherever the ray crosses that line - and the
    // second half of the sector is the first half mirrored. phi is a point.
    let d = (a - phi) % sec;
    if (d < 0) d += sec;
    if (d > half) d = sec - d;
    const p = f.inner;
    return p * Math.sin(half) / (Math.sin(d) + p * Math.sin(half - d));

    if (f.table || !f.n) return 0;                          // drawn the right way up already

    return -Math.PI / 2 + (f.n % 2 ? Math.PI / f.n : 0);    // odd sides point, even sides sit

const TABLE_N = 720;
function bakeOutline(parts) {
    const t = new Float64Array(TABLE_N);
    for (let i = 0; i < TABLE_N; i++) {
        const a = i / TABLE_N * Math.PI * 2, cx = Math.cos(a), cy = Math.sin(a);
        let far = 0;
        for (const ring of parts) {
            for (let j = 0; j < ring.length; j++) {
                const q = ring[j], w = ring[(j + 1) % ring.length];
                const ex = w[0] - q[0], ey = w[1] - q[1];
                const den = ex * cy - cx * ey;
                if (!den) continue;
                const u = (ex * q[1] - ey * q[0]) / den;      // how far along the ray
                const v = (cx * q[1] - cy * q[0]) / den;      // how far along the edge
                if (u > far && v >= 0 && v <= 1) far = u;
            }
        }
        t[i] = far;
    }
    let max = 0;
    for (const r of t) if (r > max) max = r;
    if (!max) throw new Error('outline baked to nothing');    // rather than a table of NaN
    for (let i = 0; i < TABLE_N; i++) t[i] /= max;            // corners at 1, as a polygon

/* Drawn to the same outer radius, a triangle looks a good deal smaller than a
   circle and a fish smaller again, because what you judge is how much of the
   page a thing covers, not how far its furthest corner reaches. So each shape
   measures its own half width and half height the way up it is demonstrated,
   and the lap is then sized to fit them all into the same box. */
for (const k of Object.keys(SHAPES)) {
    const turn = uprightTurn(k);
    let mx = 0, my = 0;
    for (let i = 0; i < 720; i++) {
        const a = i / 720 * Math.PI * 2, r = profile(a, k, turn);
        mx = Math.max(mx, Math.abs(Math.cos(a) * r));
        my = Math.max(my, Math.abs(Math.sin(a) * r));
    }
    SHAPES[k].halfW = mx || 1;
    SHAPES[k].halfH = my || 1;

/* Which way up they drew it is their business, so the turn is fitted rather
   than demanded: sweep one sector coarsely, then close in around the best.
   A sector is all that is needed - the profile repeats every one of them. */
function fitTurn(ang, rad, key, fine) {
    const f = SHAPES[key] || {};
    if (!f.n && !f.table) {                     // a circle has nothing to turn
        let t = 0; for (const r of rad) t += r;
        return { phi: 0, R: t / rad.length };
    }
    // A fish has no symmetry to exploit, so its whole turn is the sector.
    // Sweeping it too coarsely lands on the wrong minimum of a lumpy surface -
    // the shield was coming out a full step askew, which is what made the
    // dashed ghost look rotated for no reason - so the settled verdict sweeps
    // it finely. The running fit, which happens on every sample of every
    // stroke, does not need to and cannot afford to.
    const sec = f.table ? Math.PI * 2 : 2 * Math.PI / f.n;
    const coarse = f.table ? (fine ? 120 : 36) : (fine ? 48 : 16);
    /* Some shapes fit nearly as well at several turns - a shield was coming out
       nine degrees over however finely the sweep was done, because nine degrees
       genuinely costs it almost nothing. Where two turns are that close,
       whichever is nearer the way it was demonstrated wins: the tenth of a
       percent this bends the residual by cannot move a fit that is really
       better, and it stops the dashed ghost sitting there askew for no reason
       a player could see. */
    const home = uprightTurn(key);
    const fromHome = phi => Math.abs(((phi - home) % sec + sec * 1.5) % sec - sec / 2);
    let best = null;
    const tryPhi = phi => {
        let su = 0, sru = 0;
        for (let i = 0; i < rad.length; i++) {
            const u = profile(ang[i], key, phi);
            su += u * u; sru += rad[i] * u;
        }
        const R = su ? sru / su : 0;
        let v = 0;
        for (let i = 0; i < rad.length; i++) {
            const d = rad[i] - R * profile(ang[i], key, phi);
            v += d * d;
        }
        const tipped = v * (1 + fromHome(phi) * .03);
        if (!best || tipped < best.tipped) best = { phi, R, v, tipped };
    };
    for (let i = 0; i < coarse; i++) tryPhi(i * sec / coarse);
    const c = best.phi;
    for (let i = -4; i <= 4; i++) tryPhi(c + i * sec / (coarse * 4));
    return best;
}

const BINS = 180;                   // two degrees each
const MIN_R = 26;                   // nothing drawn on top of the dot counts
const MIN_MEAN = 46;                // and a tiny circle is not an achievement
const GAP_ALLOW = 2;                // bins you may leave empty and still be round
const binOf = a => ((Math.floor((a + Math.PI) / (2 * Math.PI) * BINS) % BINS) + BINS) % BINS;

function judge(points, fine) {
    if (points.length < 24) return { ok: false, lap: 0, why: 'Too short - draw all the way round the dot.' };
    const sum = new Float64Array(BINS), cnt = new Uint32Array(BINS);
    let sweep = 0, pa = null, pr = 0, inside = false;

    for (const p of points) {
        const dx = p[0] - p[2], dy = p[1] - p[3];
        const r = Math.hypot(dx, dy);
        if (r < MIN_R) { inside = true; break; }
        const a = Math.atan2(dy, dx);
        if (pa === null) {
            const b = binOf(a);
            sum[b] += r; cnt[b]++;
        } else {
            // file the whole arc between two samples, not just where they landed:
            // otherwise a small circle, or a quick one, leaves bins empty that the
            // pen went straight through, and reads as a gap
            let d = a - pa;
            while (d > Math.PI) d -= 2 * Math.PI;
            while (d < -Math.PI) d += 2 * Math.PI;
            sweep += d;
            const steps = Math.max(1, Math.ceil(Math.abs(d) / (Math.PI * 2 / BINS)));
            for (let i = 1; i <= steps; i++) {
                const b = binOf(pa + d * (i / steps));
                sum[b] += pr + (r - pr) * (i / steps); cnt[b]++;
            }
        }
        pa = a; pr = r;
    }
    if (inside) return { ok: false, lap: 0, why: 'Too close to the dot - give it some room.' };

    let filled = 0, total = 0, n = 0;
    const ang = [], rad = [];
    for (let i = 0; i < BINS; i++) if (cnt[i]) {
        filled++; const r = sum[i] / cnt[i]; total += r; n++;
        ang.push((i + .5) / BINS * 2 * Math.PI - Math.PI); rad.push(r);
    }
    const lap = filled / BINS, mean = total / n;
    const way = Math.sign(sweep);
    // the fit is worked out as soon as there is enough of a shape to fit, so
    // the line can be coloured against it while it is still being drawn
    const form = run.form;
    const f = n >= 12 ? fitTurn(ang, rad, form, fine) : null;
    const part = f ? { lap, mean, way, R: f.R, phi: f.phi, form } : { lap, way };
    if (filled < BINS - GAP_ALLOW)
        return { ...part, ok: false, why: Math.abs(sweep) < Math.PI * 1.6
            ? `Not all the way round - one full lap of the dot.`
            : 'There is a gap in that one - one unbroken lap.' };

    if (run.way && way && way !== run.way)
        return { ...part, ok: false, why: `Wrong way round - ${wayName(run.way)} this time.` };
    if (mean < MIN_MEAN) return { ...part, ok: false, why: 'Too small to judge - draw it bigger.' };

    let v = 0;
    for (let i = 0; i < n; i++) { const d = rad[i] - f.R * profile(ang[i], form, f.phi); v += d * d; }
    const sd = Math.sqrt(v / n);
    // A finger on glass is nothing like as steady as it feels. A respectable
    // freehand circle wanders about 15% off its own average, so a curve tuned
    // for a 2% wobble buried every real attempt in the bottom of the range.
    // At this exponent a normal circle lands in the sixties, a careful one in
    // the eighties, and the nineties still have to be earned.
    const score = 100 * Math.pow(Math.max(0, 1 - sd / mean), 3);
    return { ...part, ok: true, score: Math.max(0, Math.min(100, score)) };
}

// the running mean while the pen is still down, for the live colouring
function meanSoFar(points) {
    let t = 0;
    for (const p of points) t += Math.hypot(p[0] - p[2], p[1] - p[3]);
    return points.length ? t / points.length : 0;

/* ---- which way round, when the round insists --------------------------- */
function drawWay(cx, cy) {
    const R = 21, d = run.way, a0 = -Math.PI * .8, a1 = a0 + d * Math.PI * 1.15;

    ctx.strokeStyle = '#241F2E'; ctx.fillStyle = '#241F2E';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();

    ctx.stroke();

    const t = a1 + d * Math.PI / 2;               // the tangent, pointing the way round
    ctx.beginPath();

    ctx.lineTo(hx + Math.cos(t + 2.5) * 9, hy + Math.sin(t + 2.5) * 9);
    ctx.lineTo(hx + Math.cos(t - 2.5) * 9, hy + Math.sin(t - 2.5) * 9);

/* ---- showing them what to do -----------------------------------------

   end of it, until the first time they touch the screen. It says what a
   paragraph of instructions would and gets out of the way by itself. */
const DEMO = { sweep: 2.2, hold: .5, fade: .45, gap: .7 };
const DEMO_CYCLE = DEMO.sweep + DEMO.hold + DEMO.fade + DEMO.gap;

    if (t > DEMO.sweep + DEMO.hold + DEMO.fade) return;
    const e = Math.min(1, t / DEMO.sweep);
    const over = t - DEMO.sweep - DEMO.hold;
    const fade = over > 0 ? Math.max(0, 1 - over / DEMO.fade) : 1;

    // shows up as a darker blob on it. A finished lap used to end on the point
    // it started from, stacking two round end caps at the top of the shape, so
    // it is closed properly instead - and the alpha lives in the colour rather
    // than on the context, so one stroke of one path composites once.

    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    for (let i = 0; i <= last; i++) {

        const rr = R * profile(a, run.form, phi);
        hx = cx + Math.cos(a) * rr; hy = cy + Math.sin(a) * rr;
        i ? ctx.lineTo(hx, hy) : ctx.moveTo(hx, hy);
    }
    if (shut) ctx.closePath();
    ctx.stroke();
    if (e < 1 && HAND.complete && HAND.naturalWidth) {
        const k = HAND_SCALE * .88;
        ctx.globalAlpha = .34 * fade;
        ctx.translate(hx, hy);
        ctx.rotate(-HAND_ANG);
        ctx.drawImage(HAND, -HAND_TIPX * k, -HAND_TIPY * k, HAND_W * k, HAND_H * k);

let snap = null;
// out to perfect by a third of the way in, held, and relaxed back by the end
function snapAmount(e) {
    if (e <= 0 || e >= 1) return 0;
    if (e < .3) { const t = e / .3; return 1 - Math.pow(1 - t, 3); }
    if (e < .62) return 1;
    const t = (e - .62) / .38;
    return 1 - t * t;
}
// where a point would be if you had drawn it perfectly
function snapPoint(p, amt, fit) {
    if (!amt || !fit || !fit.R) return p;
    const a = Math.atan2(p[1] - p[3], p[0] - p[2]);
    const r = Math.hypot(p[0] - p[2], p[1] - p[3]);
    const want = fit.R * profile(a, fit.form, fit.phi);
    const rr = r + (want - r) * amt;
    return [p[2] + Math.cos(a) * rr, p[3] + Math.sin(a) * rr, p[2], p[3], p[4]];
}

function seedBurst(ok) {
    const parts = [], n = ok ? 28 : 18;
    for (let i = 0; i < n; i++) {
        const p = pts[(Math.random() * pts.length) | 0];
        const a = Math.atan2(p[1] - p[3], p[0] - p[2]);
        const sp = ok ? 110 + Math.random() * 230 : 30 + Math.random() * 80;
        parts.push({ x: p[0], y: p[1],
                     vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + (ok ? -40 : 40),
                     r: 2.2 + Math.random() * 3.6 });
    }
    burst = { t0: now(), ok, parts, mean: verdict.mean };
}
const FADE_MS = 620;                // how long your line lasts, when it does not

function draw() {
    const ms = now();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(CX, CY + view.y);
    ctx.scale(view.k, view.k);
    ctx.translate(-CX, -CY);

    // the crowd, when there is one
    if (has('swarm') && !(verdict && verdict.ok)) {
        ctx.fillStyle = 'rgba(36,31,46,.3)';
        for (const [x, y, s] of swarmAt(ms)) {
            ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
        }
    }

    // where the dot has wandered, so you can see what you were chasing
    const [dx, dy] = verdict && verdict.ok && pts.length ? [pts[pts.length - 1][2], pts[pts.length - 1][3]]
                                                         : dotAt(ms);
    if (has('drift') && pts.length > 1) {
        ctx.strokeStyle = 'rgba(36,31,46,.2)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pts[0][2], pts[0][3]);
        for (const p of pts) ctx.lineTo(p[2], p[3]);
        ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(dx, dy, DOT, 0, Math.PI * 2);
    ctx.fillStyle = '#241F2E';
    ctx.fill();

    if (demoOn()) drawDemo(ms, dx, dy);
    // Nothing may be drawn inside MIN_R anyway, so the arrow sits in that dead
    // zone: always visible, never in the way of the line.
    if (run.way && run.live && card.hidden && !(verdict && verdict.ok)) drawWay(dx, dy);

    // the line you should have drawn: the radius you held on average, kept
    // around wherever the dot was at the time
    if (verdict && verdict.ok && pts.length > 1) {
        ctx.save();
        ctx.setLineDash([7, 9]);
        ctx.strokeStyle = 'rgba(36,31,46,.45)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        pts.forEach((p, i) => {
            const a = Math.atan2(p[1] - p[3], p[0] - p[2]);
            const r = verdict.R * profile(a, verdict.form, verdict.phi);
            const x = p[2] + Math.cos(a) * r, y = p[3] + Math.sin(a) * r;
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }

    if (burst) {
        const t = (now() - burst.t0) / 1000, LIFE = .8;
        if (t >= LIFE) burst = null;
        else {
            const e = t / LIFE;
            if (burst.ok) {                       // a ring going out from the line
                ctx.globalAlpha = (1 - e) * .75;
                ctx.strokeStyle = '#3fa45b';
                ctx.lineWidth = 6 * (1 - e) + 1;
                ctx.beginPath();
                ctx.arc(dx, dy, burst.mean + e * 110, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.globalAlpha = 1 - e;
            ctx.fillStyle = burst.ok ? '#F4B32C' : '#e8524f';
            for (const q of burst.parts) {
                ctx.beginPath();
                ctx.arc(q.x + q.vx * t, q.y + q.vy * t + (burst.ok ? 40 : 520) * t * t,
                        q.r * (1 - e * .55), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
    }

    if (pts.length > 1) {
        // colour each bit by how far it is from the shape that best fits what
        // has been drawn so far - which for a circle is just its own average
        const fit = (verdict && verdict.ok ? verdict : liveJ) || null;
        const mean = fit && fit.mean ? fit.mean : meanSoFar(pts);
        const fading = has('fade') && drawing;
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = 1;
        /* Every segment used to be stroked on its own. At full opacity that is
           invisible, but the moment the ink fades each round cap is painted
           over its neighbour and the line comes out scalloped and blotchy. So
           the colour and the fade are quantised - finely enough that nothing
           banding shows - and a run of segments that agree on both is stroked
           as one path, which composites once. It is also a great many fewer
           calls than one per sample. */
        let key = null, open = false;
        const flush = () => { if (open) { ctx.stroke(); open = false; } };
        // a good one pulls itself onto the shape it was aiming at
        let amt = 0, lit = -1;
        if (snap) {
            const e = (ms - snap.t0) / SNAP_MS;
            if (e >= 1) snap = null;
            else { amt = snapAmount(e); lit = Math.min(1, e / .62); }
        }
        if (amt > 0) {                         // the gold underneath, as one pass
            ctx.save();
            ctx.strokeStyle = `rgba(244, 179, 44, ${(amt * .85).toFixed(3)})`;
            ctx.lineWidth = 15;
            ctx.beginPath();
            for (let i = 0; i < pts.length; i++) {
                const q = snapPoint(pts[i], amt, fit);
                i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
            }
            ctx.stroke();
            ctx.restore();
        }
        for (let i = 1; i < pts.length; i++) {
            const a = snapPoint(pts[i - 1], amt, fit), b = snapPoint(pts[i], amt, fit);
            let alpha = 1;
            if (fading) {
                alpha = 1 - (ms - b[4]) / FADE_MS;
                if (alpha <= 0) { flush(); key = null; continue; }
            }
            const r = Math.hypot(pts[i][0] - b[2], pts[i][1] - b[3]);
            const want = fit && fit.R
                ? fit.R * profile(Math.atan2(b[1] - b[3], b[0] - b[2]), fit.form, fit.phi) : mean;
            const off = mean > 0 ? Math.round(Math.abs(r - want) / mean * 240) / 240 : 0;
            const step = Math.round(alpha * 16) / 16;
            const k = off + '|' + step;
            if (k !== key) {
                flush();
                key = k;
                const col = mean > 0 ? shade(off) : 'rgb(63,164,91)';
                ctx.strokeStyle = step >= 1 ? col
                    : col.replace('rgb(', 'rgba(').replace(')', `,${step})`);
                ctx.beginPath();
                ctx.moveTo(a[0], a[1]);
                open = true;
            }
            ctx.lineTo(b[0], b[1]);
        }
        flush();
        // and a light running once round it while it holds
        if (lit >= 0 && lit < 1) {
            const at = Math.floor(lit * (pts.length - 1)), span = Math.max(4, pts.length / 14 | 0);
            const from = Math.max(0, at - span);
            ctx.save();
            ctx.strokeStyle = '#fffdf8';
            ctx.lineWidth = 9;
            ctx.beginPath();
            for (let i = from; i <= at; i++) {
                const q = snapPoint(pts[i], amt, fit);
                i === from ? ctx.moveTo(q[0], q[1]) : ctx.lineTo(q[0], q[1]);
            }
            ctx.stroke();
            ctx.restore();
        }
        ctx.globalAlpha = 1;
    }

    // whoever is doing the drawing, at the sharp end of it
    if (drawing && pts.length) {
        const p = pts[pts.length - 1], k = HAND_SCALE;
        if (HAND.complete && HAND.naturalWidth) {
            ctx.save();
            ctx.translate(p[0], p[1]);          // the point of contact
            ctx.rotate(-HAND_ANG);              // the finger points up; swing it up-left
            ctx.drawImage(HAND, -HAND_TIPX * k, -HAND_TIPY * k, HAND_W * k, HAND_H * k);
            ctx.restore();
        }
    }
    // every path out of here goes past this: an early return would leave the
    // view transform on the stack, and the dot would walk off the screen
    ctx.restore();
}

// ease the drawing to wherever it needs to be, rather than snapping it there
function easeView(to) {
    const from = { ...view }, t0 = now(), MS = 340;
    cancelAnimationFrame(viewAnim);
    const step = () => {
        const t = Math.min(1, (now() - t0) / MS), e = 1 - Math.pow(1 - t, 3);
        view = { y: from.y + (to.y - from.y) * e, k: from.k + (to.k - from.k) * e };
        draw();
        if (t < 1) viewAnim = requestAnimationFrame(step);
    };
    viewAnim = requestAnimationFrame(step);
}
// the circle wants to sit in the gap between the HUD and whatever is below it
function liftView(floor) {
    if (!verdict || !verdict.mean) return;
    const top = 64;
    const bottom = Math.max(top + 120,
        (floor !== undefined ? floor : card.querySelector('.inner').getBoundingClientRect().top) - 18);
    const room = Math.min(bottom - top, W - 36);
    const k = Math.min(1, room * .5 / (verdict.mean + 14));
    easeView({ y: (top + bottom) / 2 - CY, k });
}

/* ---- the frame loop, running whenever a round is live ---------------- */
let lastTick = 0;
function frame() {
    raf = requestAnimationFrame(frame);
    if (rejected && run.live && !drawing && card.hidden
        && (now() - idleT0) / 1000 > REJECT_WAIT) forgetAttempt();
    if (run.live && drawing) {
        const left = run.limit - (now() - penT0) / 1000;
        clockFill.style.width = `${Math.max(0, left / run.limit) * 100}%`;
        clockEl.classList.toggle('low', left < run.limit * .3);
        if (left < run.limit * .3 && now() - lastTick > 240) { lastTick = now(); tick(); }
        if (left <= 0) return timeUp();
    }
    // the dot moving, the swarm drifting, the ink fading, the demo lap and the
    // burst all need repainting - and the burst outlives the round it ended,
    // so it is checked whether or not one is still going
    if (burst || snap || drawing || demoOn() || (run.live && (has('drift') || has('swarm')))) draw();
}

/* ============================================================
   THE PEN
   ============================================================ */
const MIN_STEP = 2.2;               // how far the finger moves before it counts

// a full bar, sitting there, so you can see what you are up against
function armClock() {
    clockEl.classList.add('on');
    clockEl.classList.remove('low');
    clockFill.style.width = '100%';
}
function sample(x, y) {
    const ms = now(), [cx, cy] = dotAt(ms);
    return [x, y, cx, cy, ms];
}
function start(x, y) {
    // impatient: a tap during the read-out gets on with it
    if (run.tally) return nextRound();
    if (!card.hidden || !run.live) return;
    cancelAnimationFrame(viewAnim);
    view = { y: 0, k: 1 };
    drawing = true;
    verdict = null;
    penT0 = now();
    pts = [sample(x, y)];
    liveJ = null; rejected = false;
    promptEl.classList.add('gone');
    bannerEl.classList.remove('go');
    humStart();
    draw();
}
function move(x, y) {
    if (!drawing) return;
    const last = pts[pts.length - 1];
    if (Math.hypot(x - last[0], y - last[1]) < MIN_STEP) return;
    pts.push(sample(x, y));
    draw();
    // a live read of the lap so far, so you can see it closing - and hear it
    // still judged on every sample: the hum rides how far round you are, and
    // the line is coloured against the shape that best fits what is there
    liveJ = judge(pts);
    humTo(liveJ.lap || 0);
}
function end() {
    if (!drawing) return;
    drawing = false;
    humStop();
    clockEl.classList.remove('on', 'low');
    verdict = judge(pts, true);          // the one that is kept gets the careful fit
    if (verdict.ok && verdict.way) natural = verdict.way;
    draw();
    if (verdict.ok) settle(verdict.score);
    else { buzz(); armClock(); promptEl.textContent = verdict.why;
           promptEl.classList.remove('gone'); rejected = true; idleT0 = now(); }
}
function timeUp() {
    if (!drawing) return;
    drawing = false;
    humStop();
    clockEl.classList.remove('on', 'low');
    verdict = null;
    pts = [];
    draw();
    buzz();
    armClock();
    rejected = true; idleT0 = now();
    promptEl.textContent = 'Out of time - faster next go.';
    promptEl.classList.remove('gone');
}

let usingTouch = false;
addEventListener('touchstart', e => {
    usingTouch = true;
    if (e.target.closest('.btn, #mute')) return;
    e.preventDefault();
    start(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
addEventListener('touchmove', e => {
    if (!drawing) return;
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
addEventListener('touchend', end);
addEventListener('touchcancel', end);
// pointerdown arrives before touchstart, so a finger is waved off by its own type
addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') { usingTouch = true; return; }
    if (usingTouch || e.target.closest('.btn, #mute')) return;
    start(e.clientX, e.clientY);
});
addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch' && !usingTouch) move(e.clientX, e.clientY);
});
addEventListener('pointerup', e => { if (e.pointerType !== 'touch' && !usingTouch) end(); });

   ROUNDS
   ============================================================ */
// the mark you got, looking back at you: an egg when you draw an egg,
// and a smug circle when you draw one of those
/* ---- the badge on the card -------------------------------------------
   It used to be an egg, which is only a joke about a circle, and every round
   deals something else now. So it draws the shape you were actually asked
   for - through the same profile the scoring uses - and wanders off it by an
   amount that grows as your score falls. A good pentagon gets a neat
   pentagon; a poor one gets something that has clearly had a hard time.

   The face is the other question: the shape is what you drew, the expression
   is whether it got you through. */
const FACE_OK = '<g class="fh"><circle cx="24.4" cy="31" r="3.2" fill="#241F2E"/>' +
    '<circle cx="25.6" cy="29.8" r="1.1" fill="#fffdf8"/>' +
    '<circle cx="39.6" cy="31" r="3.2" fill="#241F2E"/>' +
    '<circle cx="40.8" cy="29.8" r="1.1" fill="#fffdf8"/>' +
    '<path d="M 25 40 q 7 6.4 14 0" fill="none" stroke="#241F2E" stroke-width="2.7" stroke-linecap="round"/></g>';
const FACE_OUT = '<g class="fx"><path d="M 21.5 28.1 l 5.8 5.8 M 27.3 28.1 l -5.8 5.8" fill="none" stroke="#241F2E" stroke-width="2.6" stroke-linecap="round"/>' +
    '<path d="M 36.7 28.1 l 5.8 5.8 M 42.5 28.1 l -5.8 5.8" fill="none" stroke="#241F2E" stroke-width="2.6" stroke-linecap="round"/>' +
    '<path d="M 23.5 42 q 2.25 -4.5 4.5 0 q 2.25 4.5 4.5 0 q 2.25 -4.5 4.5 0 q 2.25 4.5 4.5 0" fill="none" stroke="#241F2E" stroke-width="2.4" stroke-linecap="round"/></g>';

function mascotFor(form, score) {
    const N = 120, CXY = 32, CY = 33, ROOM = 23;
    const turn = uprightTurn(form);
    // none of it at the top of the range, plenty of it at the bottom
    const wob = Math.max(0, Math.min(1, (92 - score) / 92)) * .30;
    const p1 = score * 1.7 % 6.283, p2 = score * 3.9 % 6.283;
    const at = a => profile(a, form, turn) *
        (1 + wob * (Math.sin(a * 3 + p1) + .65 * Math.sin(a * 5 + p2)) / 1.65);
    let mx = 0, my = 0;
    for (let i = 0; i < N; i++) {
        const a = i / N * Math.PI * 2, r = at(a);
        mx = Math.max(mx, Math.abs(Math.cos(a) * r));
        my = Math.max(my, Math.abs(Math.sin(a) * r));
    }
    const k = Math.min(ROOM / (mx || 1), ROOM / (my || 1));
    let d = '';
    for (let i = 0; i < N; i++) {
        const a = i / N * Math.PI * 2, r = at(a) * k;
        d += (i ? 'L' : 'M') + (CXY + Math.cos(a) * r).toFixed(1) + ' ' + (CY + Math.sin(a) * r).toFixed(1) + ' ';
    }
    // a sword or a bolt leaves no room for a face at full size
    const fit = Math.min(1, (mx * k) / 19);
    const face = `<g transform="translate(${CXY} ${CY}) scale(${fit.toFixed(2)}) translate(${-CXY} ${-CY})">`
        + FACE_OK + FACE_OUT + '</g>';
    return `<svg viewBox="0 0 64 64"><path d="${d}Z" fill="${score >= 68 ? '#F4B32C' : '#FFF0D2'}" `
        + `stroke="#241F2E" stroke-width="3" stroke-linejoin="round"/>${face}</svg>`;
}

const appEl = document.getElementById('app'), flashEl = document.getElementById('flash');

function nextRound() {
    if (!run.tally) return;
    clearTimeout(tallyT);
    run.tally = false;
    tallyEl.classList.remove('on');
    startRound(run.round + 1);
}
// the screen flinches at a miss and swells at a pass
function jolt(ok, tint) {
    appEl.classList.remove('shake', 'lift');
    void appEl.offsetWidth;
    appEl.classList.add(ok ? 'lift' : 'shake');
    const col = tint || (ok ? '#fffdf8' : '#e8524f');
    flashEl.animate([{ opacity: ok ? .42 : .66, background: col },
                     { opacity: 0, background: col }],
                    { duration: ok ? 280 : 360, easing: 'ease-out' });
}

const pick = a => a[(Math.random() * a.length) | 0];
// what the card leads with when the run was your furthest yet
const RECORD_LINES = ['Your best yet', 'A new record', 'Further than ever before',
    'That is the one to beat', 'Nobody has got further. Including you.',
    'A personal best', 'New high-water mark'];

// what this round wants, in words - said at the start of it, and said again
// once a rejected attempt has been cleared off the page
function sayWhatToDraw(n) {
    const what = SHAPES[run.form].name;
    promptEl.textContent = run.way
        ? `${wayName(run.way)[0].toUpperCase()}${wayName(run.way).slice(1)} ${what}`
        // "another" only when it really is another one: every round deals its
        // own shape now, so most of the time this is the first you have seen
        : run.repeat ? `Another ${what} round the dot` : `Draw a ${what} around the dot`;
    promptEl.classList.remove('gone');
}

/* A rejected attempt - a gap, a short lap, one drawn over the dot - leaves its
   reason on screen and its line on the page, and the line is what stops the
   demonstration coming back, since that only offers itself on a blank one. So
   after the same pause it clears both and starts the lap again: the reason has
   been read by then, and what you are meant to be drawing is the thing worth
   having on screen. */
let rejected = false;
function forgetAttempt() {
    rejected = false;
    pts = []; verdict = null; liveJ = null;
    sayWhatToDraw(run.round);
    demoT0 = now();                        // and the lap starts again
    draw();
}

function startRound(n) {
    rejected = false;
    burst = null; snap = null;
    run.tally = false;
    clearTimeout(tallyT);
    clearTimeout(settleT);
    tallyEl.classList.remove('on');
    showRound(n);
    run.round = n;
    run.live = true;
    run.twists = rollTwists(n);
    run.limit = timeFor(n);
    const before = run.form;
    run.form = n === 1 ? pick(OPENERS) : dealFor(n);
    run.repeat = n > 1 && run.form === before;
    run.way = has('way') ? (natural ? -natural : -1) : 0;
    run.drift = Math.min(44, 13 + (n - TWISTS.drift.from) * 2.8);
    run.swarmN = Math.min(26, 8 + (n - TWISTS.swarm.from) * 1.6) | 0;
    roundT0 = now();
    if (has('swarm')) seedSwarm(run.swarmN);
    armClock();
    pts = []; verdict = null; drawing = false;
    // the round announcement owns the middle of the screen while it is up, so
    // the demonstration waits for it rather than drawing underneath it
    idleT0 = now(); demoT0 = now() + BANNER_MS;
    view = { y: 0, k: 1 };

    bannerEl.innerHTML = `<span class="r">Round ${n}</span>`;
    bannerEl.classList.remove('go');
    void bannerEl.offsetWidth;
    bannerEl.classList.add('go');
    sayWhatToDraw(n);
    draw();
}

// the plate carries the round you are on and the furthest you have ever got
function showRound(n) {
    document.getElementById('round-val').textContent = n;
    document.getElementById('best-val').textContent = fmt(best);
    document.getElementById('bestplate').classList.toggle('beating', n - 1 > best);
}

function settle(score) {
    const need = passMark(run.round);
    const passed = score >= need;
    const row = RATINGS[SHAPES[run.form].lines].find(r => score >= r[0]);
    const done = run.round - (passed ? 0 : 1);          // rounds actually completed
    const record = !passed && done > best;
    if (record) {
        best = done;
        try { localStorage.setItem(bestKey, String(best)); } catch (e) { /* private mode */ }
    }
    card.className = row[1] + (passed ? '' : ' failed') + (record ? ' record' : '');
    document.querySelector('.cheer').innerHTML = mascotFor(run.form, score);
    // only ever seen on the card, which only appears when the run has ended
    if (!passed) document.getElementById('ribbon').textContent = record ? 'NEW BEST' : 'GAME OVER';
    // The card is about the run ending, so the run is what it leads with. How
    // close the last one came is a detail, and it reads as one.
    document.getElementById('score').innerHTML =
        done + `<span class="pc">${done === 1 ? 'round' : 'rounds'}</span>`;
    // Every run ends on a miss, so a best was arriving in full mourning: red
    // border, red number, dead eyes and an insult. The miss is still what
    // happened, but the headline is the run - so on a best the celebration
    // leads and the joke about the shape drops to the small print.
    // down in the bottom bands the shape's own jokes join the generic ones, so
    // a bad snowman gets told it is a peanut rather than that it is a blob
    const jokes = row[0] <= 50 && SHAPES[run.form].jokes
        ? row[3].concat(SHAPES[run.form].jokes) : row[3];
    document.getElementById('rating').textContent = record ? pick(RECORD_LINES) : pick(jokes);
    document.getElementById('pass').innerHTML = passed
        ? `<span class="ok">Through</span> &middot; needed ${pc(need)}%`
        : `${pc(score)}%, needed ${pc(need)}%`;
    // On a best the card already carries the ribbon, the rounds and the record
    // line; a fifth line telling you it was a bunting flag only deflates it.
    // The joke is the headline on an ordinary run over, which is its place.
    document.getElementById('note').textContent =
        `The dashed line is the ${SHAPES[run.form].name} you were aiming for.`;
    document.getElementById('card-best').textContent = fmt(best);
    showRound(run.round);
    document.getElementById('again').textContent = passed ? `Round ${run.round + 1}` : 'Again!';
    if (!passed) run.live = false;
    // the moment the lap closes, before anything else has a say in it
    if (score >= SNAP_MARK) { snap = { t0: now() }; sparkle(); }
    jolt(passed, record && !passed ? '#f4b32c' : null);
    sting(passed || record);
    seedBurst(passed || record);

    if (passed) {
        // a beat to read it, then the next one starts on its own
        run.tally = true;
        tallyEl.innerHTML =
            `<span class="n">${pc(score)}<i>%</i></span>` +
            `<span class="l">${pick(row[2])}</span>` +
            `<span class="b">needed ${pc(need)}%</span>`;
        tallyEl.classList.add('on');
        setTimeout(() => liftView(H * .62), 40);
        tallyT = setTimeout(nextRound, 1400);
        return;
    }
    settleT = setTimeout(() => {
        card.hidden = false;
        liftView();
        if (record) { confetti(30); jingleWin(); } else jingleLose();
    }, 440);
}

document.getElementById('again').addEventListener('click', e => {
    e.stopPropagation();
    card.hidden = true;
    card.className = '';
    startRound(run.live ? run.round + 1 : 1);
    easeView({ y: 0, k: 1 });
});

// paper in the house colours, cut out in ink like everything else
const CONFETTI = ['#f4b32c', '#2fa8e0', '#e8524f', '#9CC5E4', '#3fa45b', '#fffdf8'];
function confetti(n) {
    for (let i = 0; i < n; i++) {
        const d = document.createElement('div');
        d.className = 'confetti';
        d.style.left = `${Math.random() * 100}%`;
        d.style.background = CONFETTI[(Math.random() * CONFETTI.length) | 0];
        document.getElementById('app').appendChild(d);
        d.animate([
            { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
            { transform: `translateY(${innerHeight + 80}px) rotate(${(Math.random() * 900 - 450) | 0}deg)`,
              opacity: .9 },
        ], { duration: 1700 + Math.random() * 900, easing: 'cubic-bezier(.3,.6,.6,1)' });
        setTimeout(() => d.remove(), 2700);
    }
}

fit();
startRound(1);
frame();

}
