<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Perfect Circle</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfe4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perfect Circle">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Perfect Circle - draw a circle around the dot in one stroke, and find out how round you really are.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS - the same house style as Run Boys, Run
   ============================================================ */
:root {
    --ink:    #241F2E;
    --panel:  #fffdf8;
    --gold:   #f4b32c;
    --blue:   #2fa8e0;
    --good:   #3fa45b;
    --danger: #e8524f;
    --pop:    4px 4px 0 var(--ink);
    --font:         "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
    --font-display: "Bangers", "Comic Sans MS", Impact, system-ui, sans-serif;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0; overflow: hidden;
    font-family: var(--font); color: var(--ink);
    background: linear-gradient(#bcdcf7 0%, #d7eaf9 55%, #eaf3fb 100%);
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }

/* the paper you draw on */
#pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ============================================================
   HUD
   ============================================================ */
#hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 6px; padding: 12px 10px; pointer-events: none;
}
.plate {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-display); font-size: 23px; letter-spacing: .02em;
    padding: 4px 10px 2px;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop);
}
.plate .ico { width: 17px; height: 17px; fill: var(--gold); flex: none; }
#mute {
    pointer-events: auto; cursor: pointer; align-self: center;
    padding: 6px 7px 3px; line-height: 0;
    background: var(--panel); border: 3px solid var(--ink); border-radius: 13px;
    box-shadow: var(--pop);
}
#mute:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: inline; }

/* what to do, until you have done it once */
#prompt {
    position: absolute; left: 0; right: 0; bottom: 10%; z-index: 2;
    text-align: center; pointer-events: none;
    font-family: var(--font-display); font-size: clamp(19px, 5.4vw, 26px); letter-spacing: .03em;
    color: var(--ink); opacity: .62;
    transition: opacity .2s;
}
#prompt.gone { opacity: 0; }

/* the live read-out while the pen is down */
#live {
    position: absolute; left: 50%; top: 13%; transform: translateX(-50%); z-index: 2;
    display: none; pointer-events: none;
    font-family: var(--font-display); font-size: 40px; letter-spacing: .02em;
    color: var(--ink); opacity: .35;
}
#live.on { display: block; }

/* ============================================================
   THE VERDICT
   ============================================================ */
#card {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 14px 18px 16px; pointer-events: none;
    /* no scrim over the drawing: the circle you just made is the point */
    background: linear-gradient(transparent 46%, rgba(24,20,32,.16) 78%, rgba(24,20,32,.34) 100%);
}
#card[hidden] { display: none; }
#card .inner {
    position: relative; flex: none; pointer-events: auto;
    animation: sheetIn .34s cubic-bezier(.2, 1.3, .4, 1) both;
    width: 100%; max-width: 320px; padding: 20px;
    background: var(--panel); border: 3.5px solid var(--ink); border-radius: 22px;
    box-shadow: 8px 8px 0 var(--ink); text-align: center;
}
@keyframes sheetIn { from { transform: translateY(26px); opacity: 0; }
                     to   { transform: translateY(0); opacity: 1; } }
#ribbon {
    display: none; position: absolute; top: -21px; left: 50%;
    font-family: var(--font-display); font-size: 17px; letter-spacing: .08em; white-space: nowrap;
    padding: 3px 16px 1px; transform: translateX(-50%) rotate(-3deg);
    background: var(--danger); color: var(--panel);
    border: 3px solid var(--ink); border-radius: 9px; box-shadow: var(--pop);
    animation: ribbonIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes ribbonIn { from { transform: translateX(-50%) rotate(-3deg) scale(0); }
                      to   { transform: translateX(-50%) rotate(-3deg) scale(1); } }
#card.record #ribbon { display: block; }
#card.record .inner { border-color: var(--gold); }
#card.record #score { animation: scorePop .7s cubic-bezier(.2, 1.7, .4, 1) both; }
@keyframes scorePop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* George, taking a view on your circle */
.cheer {
    position: absolute; left: -22px; top: -16px;
    width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(#cfe4f7, #eaf3fb);
    border: 3.5px solid var(--ink); box-shadow: var(--pop);
    animation: cheerIn .6s cubic-bezier(.2, 1.7, .4, 1) both;
}
.cheer svg { width: 100%; height: 100%; display: block; }
@keyframes cheerIn { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(-6deg); } }
.cheer .ok, .cheer .ko, .cheer .wob, .cheer .tongue, .cheer .hand { display: none; }
#card.m-great .ok, #card.m-great .hand { display: block; }
#card.m-good .ok { display: block; }
#card.m-meh .ok, #card.m-meh .wob { display: block; }
#card.m-poor .ko, #card.m-poor .tongue { display: block; }

#score {
    display: block; font-family: var(--font-display); font-size: 66px; line-height: .95;
    letter-spacing: .02em; color: var(--gold); margin: 6px 0 0;
}
#score .pc { font-size: .42em; opacity: .7; margin-left: 2px; }
#rating {
    margin: 2px 0 0; font-family: var(--font-display); font-size: 26px; letter-spacing: .03em;
}
#note { margin: 6px 0 0; font-size: 12px; font-weight: 700; line-height: 1.45; opacity: .7; }
#bestline {
    font-family: var(--font-display); font-size: 22px; letter-spacing: .02em;
    color: var(--gold); margin: 9px 0 0;
}
#bestline .ico { width: 15px; height: 15px; vertical-align: -2px; margin-right: 3px; fill: var(--gold); }
.btn {
    margin-top: 12px; width: 100%;
    font-family: var(--font-display); font-size: 24px; font-weight: 400; letter-spacing: .03em;
    padding: 12px; color: var(--ink);
    background: var(--gold); border: 3px solid var(--ink); border-radius: 15px;
    box-shadow: var(--pop); cursor: pointer;
}
.btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }

.confetti {
    position: absolute; z-index: 9; pointer-events: none; top: -30px;
    width: 12px; height: 16px; border: 2.5px solid var(--ink); border-radius: 3px;
}
#version { position: absolute; bottom: 8px; right: 10px; z-index: 3;
           font-size: 9px; font-weight: 800; letter-spacing: .1em; opacity: .3; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cup" viewBox="0 0 14 14">
        <path d="M 4 1.4 H 10 V 5.2 C 10 7.3, 8.7 8.6, 7 8.6 C 5.3 8.6, 4 7.3, 4 5.2 Z"/>
        <path d="M 6 8.4 H 8 V 10.4 H 6 Z"/><path d="M 3.4 10.4 H 10.6 V 12.6 H 3.4 Z"/>
        <path d="M 10.2 2.6 H 12.2 V 4.2 C 12.2 5.5, 11.2 6.2, 10.2 6.2" fill="none"
              stroke="currentColor" stroke-width="1.3"/>
        <path d="M 3.8 2.6 H 1.8 V 4.2 C 1.8 5.5, 2.8 6.2, 3.8 6.2" fill="none"
              stroke="currentColor" stroke-width="1.3"/>
    </symbol>
</svg>

<div id="app">
    <canvas id="pad"></canvas>

    <div id="hud">
        <div class="plate"><svg class="ico"><use href="#i-cup"/></svg><span id="best-val">0.0</span></div>
        <button id="mute" aria-label="Sound on or off">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241F2E"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 4 9 H 8 L 13 5 V 19 L 8 15 H 4 Z" fill="#241F2E"/>
                <g class="on"><path d="M 16.5 9.5 q 2 2.5 0 5"/><path d="M 19.5 7 q 3.6 5 0 10"/></g>
                <g class="off"><path d="M 17 9.5 L 22 14.5 M 22 9.5 L 17 14.5"/></g>
            </svg>
        </button>
    </div>

    <div id="live">0.0</div>
    <div id="prompt">Draw a circle around the dot</div>

    <div id="card" hidden>
        <div class="inner">
            <div id="ribbon">NEW BEST</div>
            <div class="cheer"></div>
            <span id="score">0.0<span class="pc">%</span></span>
            <p id="rating">Wonky</p>
            <p id="note"></p>
            <div id="bestline"><svg class="ico"><use href="#i-cup"/></svg>Best <span id="card-best">0.0</span>%</div>
            <button class="btn" id="again">Again!</button>
        </div>
    </div>

    <div id="version">v1</div>
</div>

<script>
const APP_VERSION = 'v3';
document.getElementById('version').textContent = `Perfect Circle ${APP_VERSION}`;

/* ============================================================
   SOUND - a chime pitched by how round you were
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, soundOn = true;
const soundKey = 'pc-sound';
try { soundOn = localStorage.getItem(soundKey) !== 'off'; } catch (e) { /* private mode */ }

function audioNow() {
    if (!audioCtx) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = .7;
        master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx.currentTime;
}
function tone(t0, { freq, to, dur = .18, type = 'triangle', vol = .2, at = 0 }) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .012);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(master);
    o.start(s); o.stop(s + dur + .02);
}
// the better the circle, the higher and happier the chime
function chime(score) {
    if (!soundOn) return;
    try {
        const t = audioNow();
        const base = 300 + score * 5.2;
        [0, 4, 7].slice(0, score > 80 ? 3 : score > 55 ? 2 : 1).forEach((semi, i) =>
            tone(t, { freq: base * Math.pow(2, semi / 12), dur: .34, vol: .19, at: i * .07 }));
        if (score < 40) tone(t, { freq: 190, to: 90, dur: .3, type: 'sawtooth', vol: .14 });
    } catch (e) { /* no audio here, never mind */ }
}
function fanfare() {
    if (!soundOn) return;
    try {
        const t = audioNow();
        [523, 659, 784, 1046, 1318].forEach((f, i) =>
            tone(t, { freq: f, dur: .4, vol: .2, at: i * .09 }));
        [784, 1046, 1568].forEach(f => tone(t, { freq: f, dur: .9, type: 'square', vol: .1, at: .46 }));
    } catch (e) { /* no audio here, never mind */ }
}
function buzz() {
    if (!soundOn) return;
    try { tone(audioNow(), { freq: 210, to: 110, dur: .22, type: 'sawtooth', vol: .16 }); }
    catch (e) { /* no audio here, never mind */ }
}
const muteBtn = document.getElementById('mute');
function applySound() { muteBtn.classList.toggle('muted', !soundOn); }
muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    soundOn = !soundOn;
    try { localStorage.setItem(soundKey, soundOn ? 'on' : 'off'); } catch (e) { /* private mode */ }
    applySound();
    if (soundOn) chime(70);
});
applySound();

/* ============================================================
   THE PAPER
   ============================================================ */
const cv = document.getElementById('pad'), ctx = cv.getContext('2d');
const promptEl = document.getElementById('prompt');
const liveEl = document.getElementById('live');
const card = document.getElementById('card');

let W = 0, H = 0, CX = 0, CY = 0, DOT = 7;
let pts = [], drawing = false, verdict = null;
// where the drawing is shown: straight on while you draw, lifted and shrunk
// into the space above the verdict once you have let go
let view = { y: 0, k: 1 }, viewTo = { y: 0, k: 1 }, viewAnim = 0;

function fit() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H / 2;
    draw();
}
addEventListener('resize', fit);

/* ============================================================
   SCORING

   Every point is filed by its angle from the dot, so a slow patch of
   the stroke does not count for more than a fast one, and the gaps
   show up on their own. What is left is how much the radius wandered.
   ============================================================ */
const BINS = 180;                   // two degrees each
const MIN_R = 26;                   // nothing drawn on top of the dot counts
const MIN_MEAN = 46;                // and a tiny circle is not an achievement
const GAP_ALLOW = 2;                // bins you may leave empty and still be round

const binOf = a => ((Math.floor((a + Math.PI) / (2 * Math.PI) * BINS) % BINS) + BINS) % BINS;

function judge(points) {
    if (points.length < 24) return { ok: false, why: 'Too short - draw all the way round the dot.' };
    const sum = new Float64Array(BINS), cnt = new Uint32Array(BINS);
    let sweep = 0, pa = null, pr = 0, inside = false;

    for (const p of points) {
        const dx = p[0] - CX, dy = p[1] - CY;
        const r = Math.hypot(dx, dy);
        if (r < MIN_R) { inside = true; break; }
        const a = Math.atan2(dy, dx);
        if (pa === null) {
            const b = binOf(a);
            sum[b] += r; cnt[b]++;
        } else {
            // file the whole arc between two samples, not just where they landed:
            // otherwise a small circle, or a quick one, leaves bins empty that the
            // pen went straight through, and reads as a gap
            let d = a - pa;
            while (d > Math.PI) d -= 2 * Math.PI;
            while (d < -Math.PI) d += 2 * Math.PI;
            sweep += d;
            const steps = Math.max(1, Math.ceil(Math.abs(d) / (Math.PI * 2 / BINS)));
            for (let i = 1; i <= steps; i++) {
                const f = i / steps, b = binOf(pa + d * f);
                sum[b] += pr + (r - pr) * f; cnt[b]++;
            }
        }
        pa = a; pr = r;
    }
    if (inside) return { ok: false, why: 'That went over the dot - keep it outside.' };

    let filled = 0, total = 0, n = 0;
    for (let i = 0; i < BINS; i++) if (cnt[i]) { filled++; total += sum[i] / cnt[i]; n++; }
    if (filled < BINS - GAP_ALLOW)
        return { ok: false, why: Math.abs(sweep) < Math.PI * 1.6
            ? 'Not all the way round - one full lap of the dot.'
            : 'There is a gap in that one - one unbroken lap.' };

    const mean = total / n;
    if (mean < MIN_MEAN) return { ok: false, why: 'Too small to judge - give it some room.' };

    let v = 0;
    for (let i = 0; i < BINS; i++) if (cnt[i]) { const d = sum[i] / cnt[i] - mean; v += d * d; }
    const sd = Math.sqrt(v / n);
    // a human drawing carefully lands around 1.5% off; the curve turns that
    // into the high eighties and leaves the nineties genuinely hard
    const score = 100 * Math.pow(Math.max(0, 1 - sd / mean), 8);
    return { ok: true, score: Math.max(0, Math.min(100, score)), mean, sd };
}

// the running mean while the pen is still down, for the live colouring
function meanSoFar(points) {
    let t = 0;
    for (const p of points) t += Math.hypot(p[0] - CX, p[1] - CY);
    return points.length ? t / points.length : 0;
}

/* ---- how far off is this bit, as a colour ---------------------------- */
const STOPS = [[63, 164, 91], [244, 179, 44], [232, 82, 79]];   // good, close, off
function shade(off) {
    const t = Math.max(0, Math.min(1, off / .13)) * 2;
    const i = t < 1 ? 0 : 1, f = t < 1 ? t : t - 1;
    const a = STOPS[i], b = STOPS[i + 1];
    return `rgb(${(a[0] + (b[0] - a[0]) * f) | 0},${(a[1] + (b[1] - a[1]) * f) | 0},${(a[2] + (b[2] - a[2]) * f) | 0})`;
}

/* ============================================================
   DRAWING IT ALL
   ============================================================ */
function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(CX, CY + view.y);
    ctx.scale(view.k, view.k);
    ctx.translate(-CX, -CY);

    // the dot you go round
    ctx.beginPath();
    ctx.arc(CX, CY, DOT, 0, Math.PI * 2);
    ctx.fillStyle = '#241F2E';
    ctx.fill();

    // what it should have looked like, once it has been judged
    if (verdict && verdict.ok) {
        ctx.save();
        ctx.setLineDash([7, 9]);
        ctx.strokeStyle = 'rgba(36,31,46,.42)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(CX, CY, verdict.mean, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    if (pts.length < 2) return;
    const mean = verdict && verdict.ok ? verdict.mean : meanSoFar(pts);
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const r = Math.hypot(b[0] - CX, b[1] - CY);
        ctx.strokeStyle = mean > 0 ? shade(Math.abs(r - mean) / mean) : '#3fa45b';
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
    }
    ctx.restore();
}

// ease the drawing to wherever it needs to be, rather than snapping it there
function easeView(to) {
    viewTo = to;
    const from = { ...view }, t0 = performance.now(), MS = 340;
    cancelAnimationFrame(viewAnim);
    const step = now => {
        const t = Math.min(1, (now - t0) / MS), e = 1 - Math.pow(1 - t, 3);
        view = { y: from.y + (to.y - from.y) * e, k: from.k + (to.k - from.k) * e };
        draw();
        if (t < 1) viewAnim = requestAnimationFrame(step);
    };
    viewAnim = requestAnimationFrame(step);
}
// the circle wants to sit in the gap between the HUD and the top of the sheet
function liftView() {
    const sheet = card.querySelector('.inner').getBoundingClientRect();
    const top = 64, bottom = Math.max(top + 120, sheet.top - 18);
    const room = Math.min(bottom - top, W - 36);
    const k = Math.min(1, room * .5 / (verdict.mean + 14));
    easeView({ y: (top + bottom) / 2 - CY, k });
}

/* ============================================================
   THE PEN
   ============================================================ */
const MIN_STEP = 2.2;               // how far the finger moves before it counts

function start(x, y) {
    if (!card.hidden) return;
    cancelAnimationFrame(viewAnim);
    view = { y: 0, k: 1 };
    drawing = true;
    verdict = null;
    pts = [[x, y]];
    promptEl.classList.add('gone');
    liveEl.classList.add('on');
    liveEl.textContent = '';
    draw();
}
function move(x, y) {
    if (!drawing) return;
    const last = pts[pts.length - 1];
    if (Math.hypot(x - last[0], y - last[1]) < MIN_STEP) return;
    pts.push([x, y]);
    draw();
    // a live read of the lap so far, so you can see it closing
    const j = judge(pts);
    liveEl.textContent = j.ok ? j.score.toFixed(1) : '';
}
function end() {
    if (!drawing) return;
    drawing = false;
    liveEl.classList.remove('on');
    verdict = judge(pts);
    draw();
    if (verdict.ok) show(verdict.score);
    else {
        buzz();
        promptEl.textContent = verdict.why;
        promptEl.classList.remove('gone');
    }
}

let usingTouch = false;
addEventListener('touchstart', e => {
    usingTouch = true;
    if (e.target.closest('.btn, #mute')) return;
    e.preventDefault();
    start(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
addEventListener('touchmove', e => {
    if (!drawing) return;
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
addEventListener('touchend', end);
addEventListener('touchcancel', end);
// pointerdown arrives before touchstart, so a finger is waved off by its own type
addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') { usingTouch = true; return; }
    if (usingTouch || e.target.closest('.btn, #mute')) return;
    start(e.clientX, e.clientY);
});
addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch' && !usingTouch) move(e.clientX, e.clientY);
});
addEventListener('pointerup', e => { if (e.pointerType !== 'touch' && !usingTouch) end(); });

/* ============================================================
   THE VERDICT
   ============================================================ */
const PORTRAIT = `<svg viewBox="0 0 64 64">
    <path d="M 10 60 C 8 22, 19 2, 32 2 C 45 2, 56 22, 54 60 L 45 57 C 47 36, 46 22, 43 16
             C 38 24, 26 24, 21 16 C 18 22, 17 36, 19 57 Z"
          fill="#D2A03A" stroke="#241F2E" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M 26 39 L 26 51 Q 32 56 38 51 L 38 39 Z" fill="#F0B892" stroke="#241F2E" stroke-width="1.8"/>
    <path d="M 2 64 C 4 55, 17 50, 32 50 C 47 50, 60 55, 62 64 Z" fill="#2FA8E0"
          stroke="#241F2E" stroke-width="1.8"/>
    <path d="M 17 28 C 17 15, 47 15, 47 28 C 47 39, 41 48, 32 48 C 23 48, 17 39, 17 28 Z"

document.querySelector('.cheer').innerHTML = PORTRAIT;

const bestKey = 'pc-best';
let best = 0;
try { best = parseFloat(localStorage.getItem(bestKey) || '0') || 0; } catch (e) { best = 0; }
const pc = n => n.toFixed(1);
document.getElementById('best-val').textContent = pc(best);

const RATINGS = [
    [99.2, 'Are you a compass?', 'm-great'],
    [97,   'Suspiciously round', 'm-great'],
    [93,   'Very round indeed',  'm-great'],
    [88,   'Nice circle',        'm-good'],
    [80,   'Pretty good',        'm-good'],
    [68,   'Getting there',      'm-meh'],
    [50,   'A bit wobbly',       'm-meh'],
    [0,    'That is an egg',     'm-poor'],
];

function show(score) {
    const row = RATINGS.find(r => score >= r[0]);
    const record = score > best;
    if (record) {
        best = score;
        try { localStorage.setItem(bestKey, String(best)); } catch (e) { /* private mode */ }
    }
    card.className = row[2] + (record ? ' record' : '');
    document.getElementById('score').innerHTML = pc(score) + '<span class="pc">%</span>';
    document.getElementById('rating').textContent = row[1];
    document.getElementById('note').textContent =
        `The dashed ring is the circle you were aiming for - the radius you held on average.`;
    document.getElementById('card-best').textContent = pc(best);
    document.getElementById('best-val').textContent = pc(best);
    setTimeout(() => {
        card.hidden = false;
        liftView();
        if (record && score > 0) { confetti(30); fanfare(); }
        else chime(score);
    }, 420);
}

document.getElementById('again').addEventListener('click', e => {
    e.stopPropagation();
    card.hidden = true;
    card.className = '';
    pts = []; verdict = null;
    promptEl.textContent = 'Draw a circle around the dot';
    promptEl.classList.remove('gone');
    easeView({ y: 0, k: 1 });
});

// paper in the house colours, cut out in ink like everything else
const CONFETTI = ['#f4b32c', '#2fa8e0', '#e8524f', '#9CC5E4', '#3fa45b', '#fffdf8'];
function confetti(n) {
    for (let i = 0; i < n; i++) {
        const d = document.createElement('div');
        d.className = 'confetti';
        d.style.left = `${Math.random() * 100}%`;
        d.style.background = CONFETTI[(Math.random() * CONFETTI.length) | 0];
        document.getElementById('app').appendChild(d);
        d.animate([
            { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
            { transform: `translateY(${innerHeight + 80}px) rotate(${(Math.random() * 900 - 450) | 0}deg)`,
              opacity: .9 },
        ], { duration: 1700 + Math.random() * 900, easing: 'cubic-bezier(.3,.6,.6,1)' });
        setTimeout(() => d.remove(), 2700);
    }
}

fit();

/* offline, once it is served over http(s) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
